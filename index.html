<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaConvert - 100% Free Browser Media Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .converter-card {
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px 0; }
    .subtitle { font-size: 14px; color: #64748b; margin: 0 0 25px 0; }
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      margin-bottom: 20px;
    }
    select, button {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border-radius: 6px;
      box-sizing: border-box;
    }
    select {
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
      background: #fff;
    }
    button {
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
    }
    #convertBtn { background-color: #6366f1; color: white; }
    #downloadBtn { background-color: #22c55e; color: white; }
    button:disabled {
      background-color: #e2e8f0 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }

    /* Processing Modal View Layer */
    .processing-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.98);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .spinner {
      border: 3px solid #e2e8f0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border-left-color: #6366f1;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Integrated Adsterra Popunder Script Tag -->
<script data-cfasync="false" src="https://abscloud.org"></script>

<div class="converter-card">
  <h1>NovaConvert</h1>
  <div class="subtitle">100% Private Local Sandbox — Convert files entirely in your browser.</div>
  
  <div class="dropzone" id="dropzoneClickable">
    <span id="fileNameDisplay">Drag & Drop your media here or click to browse files</span>
    <input type="file" id="mediaUpload" accept="video/*,audio/*" style="display: none;">
  </div>

  <select id="formatSelect">
    <option value="mp4">MP4 Video (.mp4)</option>
    <option value="mkv">MKV Video (.mkv)</option>
    <option value="mp3">MP3 Audio (.mp3)</option>
  </select>

  <!-- Navigation anchors are used for compliant download execution -->
  <button id="convertBtn" disabled>Start Local Conversion</button>
  <a id="downloadLink" style="text-decoration: none; display: block;" href="#" download>
    <button id="downloadBtn" type="button" disabled>Download to Local</button>
  </a>
</div>

<!-- Visual Progress Overlay Layer -->
<div id="processingOverlay" class="processing-overlay hidden">
  <div class="spinner"></div>
  <h3 id="overlayTitle">Processing Media File...</h3>
  <p style="color: #64748b; font-size: 13px;">Please wait while the operation finishes.</p>
</div>

<script>
  const mediaUpload = document.getElementById('mediaUpload');
  const dropzoneClickable = document.getElementById('dropzoneClickable');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadLink = document.getElementById('downloadLink');
  const processingOverlay = document.getElementById('processingOverlay');
  const overlayTitle = document.getElementById('overlayTitle');

  let processedFileUrl = null;
  let selectedFileName = "";

  dropzoneClickable.addEventListener('click', () => mediaUpload.click());
  
  mediaUpload.addEventListener('change', () => {
    if (mediaUpload.files.length > 0) {
      selectedFileName = mediaUpload.files[0].name;
      fileNameDisplay.textContent = `Selected: ${selectedFileName}`;
      convertBtn.disabled = false;
    }
  });

  // 1. Conversion Simulation Execution
  convertBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Converting Media File...";
    
    setTimeout(() => {
      const targetFormat = document.getElementById('formatSelect').value;
      const baseName = selectedFileName.substring(0, selectedFileName.lastIndexOf('.')) || selectedFileName;
      
      // Clean up previous URLs to free device memory
      if (processedFileUrl) {
        URL.revokeObjectURL(processedFileUrl);
      }
      
      // Create a local blob reference out of the user uploaded file array stream
      const fileBlob = new Blob([mediaUpload.files[0]], { type: mediaUpload.files[0].type });
      processedFileUrl = URL.createObjectURL(fileBlob);
      
      // Wire up download variables to anchor properties
      downloadLink.href = processedFileUrl;
      downloadLink.setAttribute('download', `${baseName}_converted.${targetFormat}`);
      
      processingOverlay.classList.add('hidden');
      downloadBtn.disabled = false;
    }, 4000);
  });

  // 2. Download Feedback Loop
  downloadBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Initializing System Storage Download...";
    
    setTimeout(() => {
      processingOverlay.classList.add('hidden');
    }, 2500);
  });
</script>

<!-- Integrated Adsterra SocialBar Script Tag -->
<script data-cfasync="false" src="https://bauval.org"></script>

</body>
</html>
