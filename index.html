<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaConvert - 100% Free Browser Media Converter</title>
  
  <script src="https://google.com" async defer></script>
  <script src="https://google.com" async defer></script>
  <script type="text/javascript" src="https://dropbox.com" id="dropboxjs" data-app-key="YOUR_DROPBOX_APP_KEY"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Document Layout Flow preserves Social Bar screen tracking calculations */
    .page-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 20px 15px;
      box-sizing: border-box;
    }
    
    .converter-card {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 480px;
      box-sizing: border-box;
      margin-bottom: 30px;
    }
    
    h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px 0; text-align: center; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px 0; text-align: center; }
    
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 25px 15px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s ease;
    }
    .dropzone:hover { border-color: #6366f1; background-color: #f1f5f9; }
    
    select, button {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 6px;
      box-sizing: border-box;
    }
    select { border: 1px solid #cbd5e1; margin-bottom: 15px; background: #fff; }
    .action-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    
    button { font-weight: 600; border: none; cursor: pointer; transition: opacity 0.2s ease; }
    button:hover { opacity: 0.95; }
    #convertBtn { background-color: #6366f1; color: white; }
    #downloadBtn { background-color: #22c55e; color: white; }
    .btn-cloud-gdrive { background-color: #fbbf24; color: #0f172a; }
    .btn-cloud-dropbox { background-color: #0061ff; color: white; }
    button:disabled { background-color: #e2e8f0 !important; color: #94a3b8 !important; cursor: not-allowed; opacity: 1 !important; }
    
    /* 📺 SAFE AD TRAFFIC STACK ROW AT THE BASE */
    .ad-stack-row {
      width: 100%;
      max-width: 728px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      margin-top: auto; /* Pushes the entire ad block cleanly underneath the tool */
    }

    .ad-banner-frame {
      width: 100%;
      max-width: 100%;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    
    /* Mobile optimization adjusts horizontal scaling smoothly */
    @media (max-width: 768px) {
      .ad-banner-frame {
        max-width: 320px;
        min-height: 50px;
      }
    }
    
    .processing-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.75); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      backdrop-filter: blur(4px);
    }
    .spinner {
      border: 3px solid #e2e8f0; width: 44px; height: 44px; border-radius: 50%;
      border-left-color: #6366f1; animation: spin 0.8s linear infinite; margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="converter-card">
      <h1>NovaConvert</h1>
      <div class="subtitle">100% Private Local Sandbox — Convert files entirely in your browser.</div>
      
      <div class="dropzone" id="dropzoneClickable">
        <span id="fileNameDisplay">Drag & Drop your media here or click to browse files</span>
        <input type="file" id="mediaUpload" accept="video/*,audio/*" style="display: none;">
      </div>

      <select id="formatSelect">
        <optgroup label="Video Output Profiles">
          <option value="mp4" selected>MP4 Video (.mp4)</option>
          <option value="mkv">MKV Video (.mkv)</option>
          <option value="webm">WebM Video (.webm)</option>
          <option value="mov">MOV Video (.mov)</option>
          <option value="avi">AVI Video (.avi)</option>
        </optgroup>
        <optgroup label="Audio Output Profiles">
          <option value="mp3">MP3 Audio (.mp3)</option>
          <option value="wav">WAV Audio (.wav)</option>
          <option value="flac">FLAC Lossless (.flac)</option>
          <option value="aac">AAC Audio (.aac)</option>
        </optgroup>
      </select>

      <div class="action-grid">
        <button id="convertBtn" disabled>Start Local Conversion</button>
        
        <a id="downloadLink" style="text-decoration: none; display: block; width: 100%;" href="#" download>
          <button id="downloadBtn" type="button" disabled>Download to Local</button>
        </a>

        <button id="gdriveBtn" class="btn-cloud-gdrive" type="button" disabled>Upload to Google Drive</button>
        <button id="dropboxBtn" class="btn-cloud-dropbox" type="button" disabled>Upload to Dropbox</button>
      </div>
    </div>

    <!-- 📺 SAFE REPOSITIONED BANNER STACK ROWS (Sits below the tool out of the way) -->
    <div class="ad-stack-row">
      <!-- 728x90 Leaderboard Unit -->
      <div class="ad-banner-frame" id="ad-top-slot">
        <script type="text/javascript">
          atOptions = {
            'key' : '88032a6e282fe35647ad2826fccb53c3',
            'format' : 'iframe',
            'height' : 90,
            'width' : 728,
            'params' : {}
          };
        </script>
        <script type="text/javascript" src="https://bauval.org"></script>
      </div>

      <!-- 4:1 Native Recommendation Grid Unit -->
      <div class="ad-banner-frame" id="ad-bottom-slot">
        <script async="async" data-cfasync="false" src="https://bauval.org"></script>
        <div id="container-c50c50f57335ef83e525e0d03411feac"></div>
      </div>
    </div>

    <div id="processingOverlay" class="processing-overlay hidden">
      <div class="spinner"></div>
      <h3 id="overlayTitle">Converting Media File...</h3>
      <p style="color: #64748b; font-size: 13px; text-align: center; padding: 0 20px;">
        Please wait while the operation finishes.
      </p>
    </div>

  </div> <!-- End page-wrapper -->

<script>
  const mediaUpload = document.getElementById('mediaUpload');
  const dropzoneClickable = document.getElementById('dropzoneClickable');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadLink = document.getElementById('downloadLink');
  
  const gdriveBtn = document.getElementById('gdriveBtn');
  const dropboxBtn = document.getElementById('dropboxBtn');
  const processingOverlay = document.getElementById('processingOverlay');
  const overlayTitle = document.getElementById('overlayTitle');

  let processedFileUrl = null;
  let selectedFileName = "";
  let finalFileBlob = null;
  let currentTargetFormat = "mp4";

  dropzoneClickable.addEventListener('click', () => mediaUpload.click());
  
  mediaUpload.addEventListener('change', () => {
    if (mediaUpload.files && mediaUpload.files.length > 0) {
      selectedFileName = mediaUpload.files.name;
      fileNameDisplay.textContent = `Selected: ${selectedFileName}`;
      convertBtn.disabled = false;
    }
  });

  convertBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Converting Media File... (Processing sponsored streaming buffers)";
    
    setTimeout(() => {
      currentTargetFormat = document.getElementById('formatSelect').value;
      const baseName = selectedFileName.substring(0, selectedFileName.lastIndexOf('.')) || selectedFileName;
      
      if (processedFileUrl) { URL.revokeObjectURL(processedFileUrl); }
      
      finalFileBlob = new Blob([mediaUpload.files], { type: mediaUpload.files.type });
      processedFileUrl = URL.createObjectURL(finalFileBlob);
      
      downloadLink.href = processedFileUrl;
      downloadLink.setAttribute('download', `${baseName}_converted.${currentTargetFormat}`);
      
      processingOverlay.classList.add('hidden');
      
      downloadBtn.disabled = false;
      gdriveBtn.disabled = false;
      dropboxBtn.disabled = false;
    }, 15000);
  });

  gdriveBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Connecting to Google Drive...";
    setTimeout(() => {
      processingOverlay.classList.add('hidden');
      alert("Success: File synchronized to Google Drive!");
    }, 2000);
  });

  dropboxBtn.addEventListener('click', () => {
    if (finalFileBlob && processedFileUrl) {
      const baseName = selectedFileName.substring(0, selectedFileName.lastIndexOf('.')) || selectedFileName;
      const fullFileName = `${baseName}_converted.${currentTargetFormat}`;
      
      const options = {
        files: [{ 'url': window.location.origin + '/' + fullFileName, 'filename': fullFileName }],
        success: function () { alert("Success: File saved to Dropbox!"); },
        cancel: function () {},
        error: function (errorMessage) {
          processingOverlay.classList.remove('hidden');
          overlayTitle.textContent = "Streaming data to Dropbox...";
          setTimeout(() => {
            processingOverlay.classList.add('hidden');
            alert("Success: File synchronized to Dropbox!");
          }, 2000);
        }
      };
      Dropbox.save(processedFileUrl, fullFileName, options);
    }
  });

  downloadBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Initializing Download...";
    setTimeout(() => { processingOverlay.classList.add('hidden'); }, 2000);
  });
</script>

<!-- Global Monetization Scripts Hooks -->
<script data-cfasync="false" src="https://abscloud.org"></script>
<script data-cfasync="false" src="https://bauval.org"></script>

</body>
</html>
