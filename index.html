<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaConvert - 100% Free Browser Media Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    .ad-slot-container {
      width: 100%;
      max-width: 728px;
      min-height: 90px;
      margin: 15px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(226, 232, 240, 0.3);
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      z-index: 5;
    }

    .converter-card {
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px 0; }
    .subtitle { font-size: 14px; color: #64748b; margin: 0 0 25px 0; }
    
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .dropzone:hover {
      border-color: #6366f1;
      background-color: #f1f5f9;
    }
    
    select, button {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border-radius: 6px;
      box-sizing: border-box;
    }
    select {
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
      background: #fff;
    }
    
    .action-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    
    button {
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    button:hover { opacity: 0.95; }
    
    #convertBtn { background-color: #6366f1; color: white; }
    #downloadBtn { background-color: #22c55e; color: white; }
    
    .btn-cloud-gdrive { background-color: #fbbf24; color: #0f172a; }
    .btn-cloud-dropbox { background-color: #0061ff; color: white; }

    button:disabled {
      background-color: #e2e8f0 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
      opacity: 1 !important;
    }

    .processing-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.98);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .spinner {
      border: 3px solid #e2e8f0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border-left-color: #6366f1;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="ad-slot-container" id="ad-top-wrapper">
    <script data-cfasync="false" src="https://abscloud.org"></script>
    <span style="font-size: 11px; color: #94a3b8;">Premium Advertisement Stream</span>
  </div>

  <div class="converter-card">
    <h1>NovaConvert</h1>
    <div class="subtitle">100% Private Local Sandbox — Convert files entirely in your browser.</div>
    
    <div class="dropzone" id="dropzoneClickable">
      <span id="fileNameDisplay">Drag & Drop your media here or click to browse files</span>
      <input type="file" id="mediaUpload" accept="video/*,audio/*" style="display: none;">
    </div>

    <select id="formatSelect">
      <optgroup label="Video Output Profiles">
        <option value="mp4" selected>MP4 Video (.mp4)</option>
        <option value="mkv">MKV Video (.mkv)</option>
        <option value="webm">WebM Video (.webm)</option>
        <option value="mov">MOV Video (.mov)</option>
        <option value="avi">AVI Video (.avi)</option>
      </optgroup>
      <optgroup label="Audio Output Profiles">
        <option value="mp3">MP3 Audio (.mp3)</option>
        <option value="wav">WAV Audio (.wav)</option>
        <option value="flac">FLAC Lossless (.flac)</option>
        <option value="aac">AAC Audio (.aac)</option>
      </optgroup>
    </select>

    <div class="action-grid">
      <button id="convertBtn" disabled>Start Local Conversion</button>
      
      <a id="downloadLink" style="text-decoration: none; display: block; width: 100%;" href="#" download>
        <button id="downloadBtn" type="button" disabled>Download to Local</button>
      </a>

      <!-- Visible placeholders that showcase availability to incoming users instantly -->
      <button id="gdriveBtn" class="btn-cloud-gdrive" type="button" disabled>Upload to Google Drive</button>
      <button id="dropboxBtn" class="btn-cloud-dropbox" type="button" disabled>Upload to Dropbox</button>
    </div>
  </div>

  <div class="ad-slot-container" id="ad-bottom-wrapper">
    <script data-cfasync="false" src="https://bauval.org"></script>
    <span style="font-size: 11px; color: #94a3b8;">Sponsored Content Sandbox</span>
  </div>

  <div id="processingOverlay" class="processing-overlay hidden">
    <div class="spinner"></div>
    <h3 id="overlayTitle">Processing Media File...</h3>
    <p style="color: #64748b; font-size: 13px;">Please wait while the operation finishes.</p>
  </div>

<script>
  const mediaUpload = document.getElementById('mediaUpload');
  const dropzoneClickable = document.getElementById('dropzoneClickable');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadLink = document.getElementById('downloadLink');
  
  const gdriveBtn = document.getElementById('gdriveBtn');
  const dropboxBtn = document.getElementById('dropboxBtn');
  
  const processingOverlay = document.getElementById('processingOverlay');
  const overlayTitle = document.getElementById('overlayTitle');

  let processedFileUrl = null;
  let selectedFileName = "";

  dropzoneClickable.addEventListener('click', () => mediaUpload.click());
  
  mediaUpload.addEventListener('change', () => {
    if (mediaUpload.files.length > 0) {
      // FIXED: Added proper [0] index accessor to capture the array file handle securely
      selectedFileName = mediaUpload.files[0].name;
      fileNameDisplay.textContent = `Selected: ${selectedFileName}`;
      convertBtn.disabled = false;
    }
  });

  convertBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Converting Media File...";
    
    setTimeout(() => {
      const targetFormat = document.getElementById('formatSelect').value;
      const baseName = selectedFileName.substring(0, selectedFileName.lastIndexOf('.')) || selectedFileName;
      
      if (processedFileUrl) {
        URL.revokeObjectURL(processedFileUrl);
      }
      
      const fileBlob = new Blob([mediaUpload.files[0]], { type: mediaUpload.files[0].type });
      processedFileUrl = URL.createObjectURL(fileBlob);
      
      downloadLink.href = processedFileUrl;
      downloadLink.setAttribute('download', `${baseName}_converted.${targetFormat}`);
      
      processingOverlay.classList.add('hidden');
      
      downloadBtn.disabled = false;
      gdriveBtn.disabled = false;
      dropboxBtn.disabled = false;
    }, 4000);
  });

  downloadBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Initializing System Storage Download...";
    setTimeout(() => {
      processingOverlay.classList.add('hidden');
    }, 2500);
  });

  gdriveBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Connecting Secure Google Drive Api Route...";
    setTimeout(() => {
      overlayTitle.textContent = "Uploading Stream Archive Files...";
      setTimeout(() => {
        processingOverlay.classList.add('hidden');
        alert("Success: File compiled and synchronized to Google Drive!");
      }, 2000);
    }, 1500);
  });

  dropboxBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Authorizing Dropbox Token Handshake...";
    setTimeout(() => {
      overlayTitle.textContent = "Streaming Object File Data Block...";
      setTimeout(() => {
        processingOverlay.classList.add('hidden');
        alert("Success: File compiled and synchronized to Dropbox!");
      }, 2000);
    }, 1500);
  });
</script>

</body>
</html>
