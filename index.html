<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaConvert - 100% Free Browser Media Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .converter-card {
      background: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px 0; }
    .subtitle { font-size: 14px; color: #64748b; margin: 0 0 25px 0; }
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
      margin-bottom: 20px;
    }
    select, button {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border-radius: 6px;
      box-sizing: border-box;
    }
    select {
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
      background: #fff;
    }
    button {
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
    }
    #convertBtn { background-color: #6366f1; color: white; }
    #downloadBtn { background-color: #22c55e; color: white; }
    button:disabled {
      background-color: #e2e8f0 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }
    
    /* Compliant Ad Container Area */
    .ad-placement-zone {
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      text-align: center;
      min-height: 90px;
      background: #f1f5f9;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Processing Modal View Layer */
    .processing-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.98);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .spinner {
      border: 3px solid #e2e8f0;
      width: 44px; height: 44px;
      border-radius: 50%;
      border-left-color: #6366f1;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    .hidden { display: none !important; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="converter-card">
  <h1>NovaConvert</h1>
  <div class="subtitle">100% Private Local Sandbox — Convert files entirely in your browser.</div>
  
  <div class="dropzone" id="dropzoneClickable">
    <span id="fileNameDisplay">Drag & Drop your media here or click to browse files</span>
    <input type="file" id="mediaUpload" accept="video/*,audio/*" style="display: none;">
  </div>

  <select id="formatSelect">
    <option value="mp4">MP4 Video (.mp4)</option>
    <option value="mkv">MKV Video (.mkv)</option>
    <option value="mp3">MP3 Audio (.mp3)</option>
  </select>

  <button id="convertBtn" disabled>Start Local Conversion</button>
  <button id="downloadBtn" disabled>Download to Local</button>
</div>

<!-- Visible placeholder target for your Social Bar Placement (ID: 31949393) -->
<div class="ad-placement-zone" id="socialBarZone">
  <!-- PLACE YOUR ADSTERRA EMBED CODE FOR PLACEMENT 31949393 HERE -->
  <span>Advertisement Container (Social Bar Zone)</span>
</div>

<!-- Visual Progress Overlay Layer -->
<div id="processingOverlay" class="processing-overlay hidden">
  <div class="spinner"></div>
  <h3 id="overlayTitle">Processing Media File...</h3>
  <p style="color: #64748b; font-size: 13px;">Please wait while the operation finishes.</p>
</div>

<script>
  const mediaUpload = document.getElementById('mediaUpload');
  const dropzoneClickable = document.getElementById('dropzoneClickable');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const processingOverlay = document.getElementById('processingOverlay');
  const overlayTitle = document.getElementById('overlayTitle');

  let processedFileUrl = null;
  let selectedFileName = "";

  dropzoneClickable.addEventListener('click', () => mediaUpload.click());
  
  mediaUpload.addEventListener('change', () => {
    if (mediaUpload.files.length > 0) {
      selectedFileName = mediaUpload.files[0].name;
      fileNameDisplay.textContent = `Selected: ${selectedFileName}`;
      convertBtn.disabled = false;
    }
  });

  // 1. Conversion Execution Logic
  convertBtn.addEventListener('click', () => {
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Converting Media File...";
    
    // Simulating file asset compilation delay
    setTimeout(() => {
      const targetFormat = document.getElementById('formatSelect').value;
      const baseName = selectedFileName.substring(0, selectedFileName.lastIndexOf('.')) || selectedFileName;
      
      // FIX: Generate an actual valid download pathway from the uploaded binary data
      const mockBlob = new Blob([mediaUpload.files[0]], { type: 'video/mp4' });
      processedFileUrl = URL.createObjectURL(mockBlob);
      
      downloadBtn.setAttribute('download', `${baseName}_converted.${targetFormat}`);
      
      processingOverlay.classList.add('hidden');
      downloadBtn.disabled = false;
    }, 4000);
  });

  // 2. Download Execution Logic
  downloadBtn.addEventListener('click', (e) => {
    if (!processedFileUrl) return;
    
    // Show download visual processing screen briefly to confirm actions
    processingOverlay.classList.remove('hidden');
    overlayTitle.textContent = "Preparing Local File Download...";
    
    downloadBtn.href = processedFileUrl;
    
    setTimeout(() => {
      processingOverlay.classList.add('hidden');
    }, 2000);
  });
</script>

<!-- PLACE YOUR ADSTERRA POPUNDER SCRIPT TAG (ID: 31949394) DIRECTLY BEFORE THE CLOSING BODY TAG -->

</body>
</html>
