<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaConvert - Free Browser Media Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .converter-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #convertBtn {
      background-color: #007bff;
      color: white;
    }
    #downloadBtn {
      background-color: #28a745;
      color: white;
    }
    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
      opacity: 0.7;
    }
    /* Shadow Screen Overlay Styling */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .overlay-content {
      text-align: center;
      max-width: 80%;
    }
    .hidden {
      display: none !important;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #fff;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="converter-container">
  <h2>NovaConvert</h2>
  <p>100% Private Local Sandbox — Convert files entirely in your browser.</p>
  
  <button id="convertBtn">Start Local Conversion</button>
  <button id="downloadBtn" disabled>Download to Local</button>
</div>

<!-- Modal Shadow Screen Overlay -->
<div id="processingOverlay" class="overlay hidden">
  <div class="overlay-content">
    <div class="spinner"></div>
    <h3>Processing Media File...</h3>
    <p>Please hold on while your file finishes converting locally in the browser sandbox.</p>
  </div>
</div>

<script>
  // Register Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker Registered'))
      .catch(err => console.error('SW Registration Failed:', err));
  }

  const convertBtn = document.getElementById('convertBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const processingOverlay = document.getElementById('processingOverlay');

  convertBtn.addEventListener('click', () => {
    // 1. Show the full-screen overlay to secure the background layout
    processingOverlay.classList.remove('hidden');
    downloadBtn.disabled = true;

    // 2. Run execution sequence (Simulating local file compilation or heavy processing)
    simulateLocalConversion(4000).then(() => {
      // 3. Clear layout blocks upon successful completion
      processingOverlay.classList.add('hidden');
      
      // 4. Safely toggle application state to permit storage access
      downloadBtn.disabled = false;
    });
  });

  function simulateLocalConversion(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  downloadBtn.addEventListener('click', () => {
    alert('Your converted local file download has initiated successfully.');
  });
</script>

</body>
</html>
