<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaConvert - 100% Free Browser Media Converter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        header { border-bottom: 1px solid #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; background-color: #020617; }
        .logo { font-size: 1.5rem; font-weight: 900; color: #22d3ee; }
        .status-badge { font-size: 0.75rem; color: #34d399; font-weight: 500; }
        main { flex: 1; max-w: 800px; width: 90%; margin: 4rem auto; display: flex; flex-direction: column; justify-content: center; }
        .hero { text-align: center; margin-bottom: 2.5rem; }
        .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.75rem; margin-top: 0; }
        .hero p { color: #94a3b8; font-size: 1.1rem; margin: 0; }
        .highlight { color: #22d3ee; }
        .card { background-color: #020617; border: 1px solid #1e293b; border-radius: 16px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .dropzone { border: 2px dashed #1e293b; border-radius: 12px; padding: 4rem 1rem; text-align: center; cursor: pointer; background-color: rgba(15, 23, 42, 0.3); transition: all 0.2s; }
        .dropzone:hover { border-color: #06b6d4; background-color: rgba(6, 182, 212, 0.05); }
        .dropzone h3 { margin: 0 0 0.5rem 0; font-size: 1.25rem; font-weight: 600; }
        .dropzone p { margin: 0; font-size: 0.85rem; color: #64748b; }
        .hidden { display: none !important; }
        .panel { display: flex; flex-direction: column; gap: 1.5rem; }
        .file-info { display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; background-color: rgba(15, 23, 42, 0.5); padding: 1rem; border-radius: 12px; }
        .file-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; color: #f1f5f9; word-break: break-all; }
        .file-size { font-size: 0.75rem; color: #64748b; }
        select { background-color: #1e293b; border: 1px solid #334155; color: white; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.9rem; outline: none; cursor: pointer; }
        .progress-container { display: flex; flex-direction: column; gap: 0.5rem; }
        .progress-text { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; }
        .bar-bg { width: 100%; background-color: #1e293b; height: 8px; border-radius: 9999px; overflow: hidden; }
        .bar-fill { background: linear-gradient(90deg, #22d3ee, #3b82f6); height: 100%; width: 0%; transition: width 0.2s; }
        button { background: linear-gradient(90deg, #06b6d4, #2563eb); color: white; font-weight: 700; border: none; padding: 1rem; border-radius: 12px; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; width: 100%; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="logo">NovaConvert</div>
        <div class="status-badge">● 100% Private Local Sandbox</div>
    </header>
    <main>
        <div class="hero">
            <h1>Convert up to <span class="highlight">2GB Free</span></h1>
            <p>Runs entirely inside your browser framework. No data leaves your machine.</p>
        </div>
        <div class="card">
            <!-- Explicit visible type handler to guarantee clicks work across all browsers -->
            <input type="file" id="filePicker" accept="video/*,audio/*" class="hidden" />
            <div id="dropZone" class="dropzone">
                <h3>Drag & Drop your media here</h3>
                <p>or click to browse your files</p>
                <p style="margin-top: 0.5rem; font-size: 0.75rem; color: #475569;">Supports MP4, MOV, MKV, AVI, WAV, MP3 up to 2GB</p>
            </div>
            <div id="processPanel" class="panel hidden">
                <div class="file-info">
                    <div>
                        <div class="file-name" id="fileNameText">video.mov</div>
                        <div class="file-size" id="fileSizeText">0.0 MB</div>
                    </div>
                    <select id="outputFormatSelect">
                        <option value="mp4">MP4 (Video)</option>
                        <option value="mp3">MP3 (Audio)</option>
                        <option value="gif">GIF (Animation)</option>
                    </select>
                </div>
                <div class="progress-container">
                    <div class="progress-text">
                        <span id="engineStatusText">Core WebAssembly Engine Ready</span>
                        <span id="percentProgressText">0%</span>
                    </div>
                    <div class="bar-bg">
                        <div id="progressBarFill" class="bar-fill"></div>
                    </div>
                </div>
                <button id="startConvertBtn">Start Local Conversion</button>
            </div>
        </div>
    </main>
    <script type="module">
        import { FFmpeg } from 'https://jsdelivr.net';
        import { toBlobURL } from 'https://jsdelivr.net';
        
        let ffmpeg = null;
        let selectedFile = null;
        
        const dropZone = document.getElementById('dropZone');
        const filePicker = document.getElementById('filePicker');
        const processPanel = document.getElementById('processPanel');
        const fileNameText = document.getElementById('fileNameText');
        const fileSizeText = document.getElementById('fileSizeText');
        const outputFormatSelect = document.getElementById('outputFormatSelect');
        const startConvertBtn = document.getElementById('startConvertBtn');
        const engineStatusText = document.getElementById('engineStatusText');
        const percentProgressText = document.getElementById('percentProgressText');
        const progressBarFill = document.getElementById('progressBarFill');

        // Simple and robust click routing logic
        dropZone.onclick = function() {
            filePicker.click();
        };
        
        // Universal drag and drop hooks without functional listing errors
        dropZone.ondragover = function(e) {
            e.preventDefault();
            dropZone.style.borderColor = "#06b6d4";
        };
        
        dropZone.ondragleave = function() {
            dropZone.style.borderColor = "#1e293b";
        };
        
        dropZone.ondrop = function(e) {
            e.preventDefault();
            dropZone.style.borderColor = "#1e293b";
            if (e.dataTransfer && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        };
        
        filePicker.onchange = function() {
            if (filePicker.files.length > 0) {
                handleFile(filePicker.files[0]);
            }
        };
        
        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            fileNameText.textContent = file.name;
            fileSizeText.textContent = `${(file.size / (1024 * 1024)).toFixed(1)} MB`;
            dropZone.classList.add('hidden');
            processPanel.classList.remove('hidden');
        }

        async function loadEngine() {
            if (ffmpeg) return ffmpeg;
            ffmpeg = new FFmpeg();
            ffmpeg.on('progress', ({ progress }) => {
                const pct = Math.round(progress * 100);
                percentProgressText.textContent = `${pct}%`;
                progressBarFill.style.width = `${pct}%`;
            });
            const base = 'https://jsdelivr.net';
            await ffmpeg.load({
                coreJSHeadlessURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
                wasmHeadlessURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
            });
            return ffmpeg;
        }

        startConvertBtn.onclick = async function() {
            if (!selectedFile) return;
            try {
                startConvertBtn.disabled = true;
                engineStatusText.textContent = "Booting local sandbox container...";
                const instance = await loadEngine();
                
                const arrayBuffer = await selectedFile.arrayBuffer();
                const fileExt = selectedFile.name.split('.').pop();
                const inputName = `input.${fileExt}`;
                
                await instance.writeFile(inputName, new Uint8Array(arrayBuffer));
                
                const fmt = outputFormatSelect.value;
                const outputName = `output.${fmt}`;
                
                engineStatusText.textContent = "Processing layout transcode blocks...";
                await instance.exec(['-i', inputName, outputName]);
                
                engineStatusText.textContent = "Assembling download vectors...";
                const data = await instance.readFile(outputName);
                const blob = new Blob([data.buffer], { type: fmt === 'mp3' ? 'audio/mp3' : 'video/mp4' });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                const rawName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.'));
                a.download = `converted_${rawName || 'file'}.${fmt}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
