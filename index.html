<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaConvert - 100% Free Browser Media Converter</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">
    <header class="border-b border-slate-800 px-6 py-4 flex justify-between items-center bg-slate-950/50">
        <span class="text-2xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">NovaConvert</span>
        <span class="text-xs text-emerald-400">● 100% Private Engine</span>
    </header>
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col justify-center my-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold mb-3">Convert up to <span class="text-cyan-400">2GB Completely Free</span></h1>
            <p class="text-slate-400">No queues. Runs entirely inside your browser's local sandbox memory.</p>
        </div>
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
            <input type="file" id="filePicker" accept="video/*,audio/*" class="hidden" />
            <div id="dropZone" class="border-2 border-dashed border-slate-800 hover:border-cyan-500/50 rounded-xl p-10 text-center cursor-pointer min-h-[260px] flex flex-col items-center justify-center">
                <h3 class="font-semibold text-lg mb-1">Drag & Drop your media here</h3>
                <p class="text-xs text-slate-500">Supports MP4, MOV, MKV, AVI, WAV, MP3 up to 2GB</p>
            </div>
            <div id="processPanel" class="hidden space-y-6 mt-4">
                <div class="flex items-center justify-between border border-slate-800 bg-slate-900/50 p-4 rounded-xl">
                    <div>
                        <div class="font-semibold text-sm" id="fileNameText">video.mov</div>
                        <div class="text-xs text-slate-500" id="fileSizeText">0.0 MB</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="outputFormatSelect" class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-3 py-1.5 text-white">
                            <option value="mp4">MP4 (Video)</option>
                            <option value="mp3">MP3 (Audio)</option>
                            <option value="gif">GIF (Animation)</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span id="engineStatusText">Core WebAssembly Engine Ready</span>
                        <span id="percentProgressText">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="progressBarFill" class="bg-gradient-to-r from-cyan-400 to-blue-500 h-full w-0"></div>
                    </div>
                </div>
                <button id="startConvertBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 font-bold py-3 rounded-xl">Start Local Conversion</button>
            </div>
        </div>
    </main>
    <script type="module">
        import { FFmpeg } from 'https://jsdelivr.net';
        import { toBlobURL } from 'https://jsdelivr.net';
        let ffmpeg = null; let selectedFile = null;
        const dropZone = document.getElementById('dropZone');
        const filePicker = document.getElementById('filePicker');
        const processPanel = document.getElementById('processPanel');
        const fileNameText = document.getElementById('fileNameText');
        const fileSizeText = document.getElementById('fileSizeText');
        const outputFormatSelect = document.getElementById('outputFormatSelect');
        const startConvertBtn = document.getElementById('startConvertBtn');
        const engineStatusText = document.getElementById('engineStatusText');
        const percentProgressText = document.getElementById('percentProgressText');
        const progressBarFill = document.getElementById('progressBarFill');

        dropZone.addEventListener('click', () => filePicker.click());
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });
        filePicker.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });
        function handleFile(file) {
            selectedFile = file;
            fileNameText.textContent = file.name;
            fileSizeText.textContent = `${(file.size / (1024 * 1024)).toFixed(1)} MB`;
            dropZone.classList.add('hidden');
            processPanel.classList.remove('hidden');
        }
        async function loadEngine() {
            if (ffmpeg) return ffmpeg;
            ffmpeg = new FFmpeg();
            ffmpeg.on('progress', ({ progress }) => {
                const pct = Math.round(progress * 100);
                percentProgressText.textContent = `${pct}%`;
                progressBarFill.style.width = `${pct}%`;
            });
            const base = 'https://jsdelivr.net';
            await ffmpeg.load({
                coreJSHeadlessURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
                wasmHeadlessURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
            });
            return ffmpeg;
        }
        startConvertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            try {
                startConvertBtn.disabled = true;
                engineStatusText.textContent = "Booting local computing workers...";
                const instance = await loadEngine();
                const arrayBuffer = await selectedFile.arrayBuffer();
                const inputName = `input.${selectedFile.name.split('.').pop()}`;
                await instance.writeFile(inputName, new Uint8Array(arrayBuffer));
                const fmt = outputFormatSelect.value;
                const outputName = `output.${fmt}`;
                engineStatusText.textContent = "Converting completely offline...";
                await instance.exec(['-i', inputName, outputName]);
                const data = await instance.readFile(outputName);
                const blob = new Blob([data.buffer], { type: fmt === 'mp3' ? 'audio/mp3' : 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `converted_${selectedFile.name.split('.')[0]}.${fmt}`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                engineStatusText.textContent = "Done!";
                startConvertBtn.disabled = false;
            } catch (err) {
                console.error(err);
                engineStatusText.textContent = "Conversion error. Please try again.";
                startConvertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
